<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="utf-8">
    <title>Kéktúra térkép</title>

    <link rel="stylesheet"
          href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

    <style>
        html, body {
            margin: 0;
            height: 100%;
        }

        #map {
            width: 100%;
            height: 100vh;
        }

        .leaflet-control-layers {
            max-height: 400px;
            overflow-y: auto;
        }
    </style>
</head>
<body>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet-gpx/2.1.2/gpx.min.js"></script>

<script>

const map = L.map('map').setView([47.2, 19.5], 8);

L.tileLayer(
    'https://outdoor.tiles.freemap.sk/{z}/{x}/{y}',
    {
        attribution: '&copy; Freemap Slovakia'
    }
).addTo(map);

const overlays = {};
const bounds = L.latLngBounds();

async function loadTracks() {

    const response = await fetch(
        'https://api.github.com/repos/nemeth-a-attila/turaterkep/contents/gpx'
    );

    const files = await response.json();

    let firstTrack = true;

    for (const file of files) {

        if (!file.name.toLowerCase().endsWith('.gpx')) {
            continue;
        }

const gpx = new L.GPX(file.download_url, {
    async: true,
    marker_options: {
        startIconUrl: '',
        endIconUrl: '',
        shadowUrl: ''
    }
});

        gpx.on('loaded', function(e) {

            const trackBounds = e.target.getBounds();

            if (trackBounds.isValid()) {
                bounds.extend(trackBounds);

                if (firstTrack) {
                    map.fitBounds(bounds);
                    firstTrack = false;
                }
            }
        });

        overlays[file.name.replace('.gpx','')] = gpx;
        gpx.addTo(map);
    }

    L.control.layers(null, overlays, {
        collapsed: false
    }).addTo(map);
}

loadTracks();

</script>

</body>
</html>
